<div class="container" *ngIf="!loading && event; else spinner">
  <mat-card class="booking-card">
    <mat-card-header>
      <mat-card-title>Book Tickets</mat-card-title>
      <mat-card-subtitle>{{event.title}} | {{event.date | date}}</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="bookingForm" (ngSubmit)="onSubmit()">
        <div class="form-row">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Full Name</mat-label>
            <input matInput formControlName="name" placeholder="John Doe">
            <mat-error *ngIf="bookingForm.get('name')?.hasError('required')">
              Name is required
            </mat-error>
          </mat-form-field>
        </div>

        <div class="form-row">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Email Address</mat-label>
            <input matInput formControlName="email" placeholder="john@example.com">
            <mat-error *ngIf="bookingForm.get('email')?.hasError('email')">
              Please enter a valid email
            </mat-error>
            <mat-error *ngIf="bookingForm.get('email')?.hasError('required')">
              Email is required
            </mat-error>
          </mat-form-field>
        </div>

        <div class="form-row">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Number of Tickets</mat-label>
            <input matInput type="number" formControlName="tickets" min="1" [max]="event.availableSeats">
            <mat-hint>Available: {{event.availableSeats}}</mat-hint>
            <mat-error *ngIf="bookingForm.get('tickets')?.hasError('min')">
              At least 1 ticket required
            </mat-error>
            <mat-error *ngIf="bookingForm.get('tickets')?.hasError('max')">
              Cannot book more than available seats
            </mat-error>
          </mat-form-field>
        </div>
        
        <div class="actions">
            <button mat-button type="button" routerLink="/events">Cancel</button>
            <button mat-raised-button color="primary" type="submit" [disabled]="bookingForm.invalid">
              Confirm Booking
            </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>

<ng-template #spinner>
  <div class="container loading">
    <mat-spinner></mat-spinner>
  </div>
</ng-template>
